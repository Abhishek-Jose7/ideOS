name: "✨ Feature Request"
description: "Suggest a new idea, capability, or improvement for ideOS."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make development continuity across AI IDEs even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the friction or problem you're experiencing.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "I'd like ideOS to support..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Have you tried any workarounds or other tools?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any mockups, screenshots, CLI output examples, or other context.
    validations:
      required: false
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: "I would be interested in helping build or test this feature!"
          required: false
